[package]
name = "sase-rust-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
pnet = "0.35"
ring = "0.17"
jsonwebtoken = "9.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
flate2 = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
